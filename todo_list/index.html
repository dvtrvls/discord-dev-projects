<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>To-do</title>
</head>
<body>
    <div class="container">
        
        <div class="alert-box">
            <h2>You must write something!</h2>
            <button>Exit</button>
        </div>

        <div class="todo-app">
            <h2>To-do app <img src="./images/icon.png" alt="todo-icon"></h2>
            
            <div class="row">
                <input type="text" id="searchInput" placeholder="Add your task here">
                <button>ADD</button>
            </div>
            <ul id="listContainer">


            </ul>
        </div>

    </div>
    
    <script src="./script.js"></script>
</body>
</html>
